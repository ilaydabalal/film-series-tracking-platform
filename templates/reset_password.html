{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[75vh] px-4 font-sans text-slate-100">
    <div class="bg-[#0d0e15] border-2 border-amber-500/70 rounded-3xl p-8 max-w-md w-full shadow-[0_0_80px_rgba(245,158,11,0.3)]">
        <h2 class="text-2xl font-serif font-bold text-amber-300 text-center mb-6">Yeni Şifre Belirle</h2>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-widest text-slate-400 mb-1.5 font-semibold">Yeni Şifre</label>
                <input type="password" name="password" required class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 py-3 rounded-xl text-xs font-bold transition shadow-lg">Şifreyi Güncelle</button>
        </form>
    </div>
</div>
{% endblock %}
