{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[75vh] px-4 font-sans text-slate-100">
    <div class="bg-[#0d0e15] border-2 border-amber-500/70 rounded-3xl p-8 md:p-10 max-w-md w-full shadow-[0_0_80px_rgba(245,158,11,0.3)] relative overflow-hidden">
        
        <!-- Arka Plan Işık Efekti -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <h2 class="text-2xl font-serif font-bold text-amber-300 text-center mb-6">Kayıt Ol</h2>

        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-widest text-slate-400 mb-1.5 font-semibold">Kullanıcı Adı</label>
                <input type="text" name="username" required class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-400 shadow-inner">
            </div>
            
            <div>
    <label class="block text-xs uppercase tracking-widest text-slate-400 mb-1.5 font-semibold">E-posta Adresi</label>
    <input type="email" name="email" required class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-400 shadow-inner">
</div>

            <div>
                <label class="block text-xs uppercase tracking-widest text-slate-400 mb-1.5 font-semibold">Şifre</label>
                <input type="password" name="password" required class="w-full bg-black/50 border border-white/15 rounded-xl px-4 py-3 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-400 shadow-inner">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 py-3 rounded-xl text-xs font-bold transition shadow-lg mt-3">Kayıt Ol</button>
            
            <p class="text-center text-xs text-slate-400 mt-6">
                Zaten hesabın var mı? <a href="{{ url_for('login') }}" class="text-amber-400 hover:underline font-semibold">Giriş Yap</a>
            </p>
        </form>

    </div>
</div>
{% endblock %}
